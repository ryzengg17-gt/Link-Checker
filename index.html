<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Link Checker</title>
<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- html5-qrcode -->
<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>

<body>

<div class="container">

  <h1 class="title">CYBER LINK CHECKER</h1>
  <p class="subtitle">Deteksi Link & QR berbahaya secara akurat</p>

  <div class="card">
    <input id="urlInput" type="text" placeholder="Masukkan URL di sini...">
    <button id="scanBtn" class="btn-primary">Link Checker</button>

    <div class="qr-buttons">
      <label class="btn-secondary">
        <input type="file" id="qrFile" hidden accept="image/*">
        <i class="fa fa-image"></i> Scan Gambar
      </label>

      <button id="cameraToggle" class="btn-secondary">
        <i class="fa fa-camera"></i> Gunakan Kamera
      </button>
    </div>

    <div id="qrPreview" class="hidden"></div>
  </div>

  <div id="resultCard" class="card hidden">
    <div id="statusBadge" class="badge">Status</div>

    <h2 class="score">
      <span id="scoreValue">0</span>/100
    </h2>

    <p id="scoreDesc" class="desc"></p>

    <div class="analysis hidden" id="analysisBox">
      <h3>Analisis Detail</h3>
      <ul id="analysisList"></ul>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
